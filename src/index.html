<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cams</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar">
    <strong class="brand">Cams</strong>
    <label>Vista <select id="view" title="Tutte le telecamere, un gruppo o una singola telecamera"></select></label>
    <button id="pick" title="Scegli al volo le telecamere da mostrare, con le caselle">☑ Scegli</button>
    <button id="grp" title="Crea e modifica i gruppi di telecamere">👥 Gruppi</button>
    <label>Layout <select id="preset"></select></label>
    <label>FPS <select id="fps"></select></label>
    <span id="pager" hidden>
      <button id="prev" title="Pagina precedente">‹</button>
      <span id="pageLbl"></span>
      <button id="next" title="Pagina successiva">›</button>
    </span>
    <span id="msg"></span>
    <button id="stats" title="Mostra/nascondi le statistiche tecniche su tutti i riquadri">📊 Statistiche</button>
    <button id="cfg" title="Gestisci telecamere e file JSON">⚙ Impostazioni</button>
    <button id="refresh" title="Rileggi cameras.json e riavvia i flussi">⟳ Aggiorna</button>
    <button id="full" title="Schermo intero">⛶</button>
  </header>
  <main id="grid"></main>
  <div id="none" hidden></div>
  <div id="picker" hidden></div>
  <footer id="foot"><span id="ver"></span></footer>
  <section id="groups" hidden>
    <div class="sbar">
      <strong>Gruppi di telecamere</strong>
      <span class="dim">Scegli il gruppo dal menu «Vista» in alto.</span>
      <span class="sp"></span>
      <button id="gAdd">＋ Nuovo gruppo</button>
      <button id="gClose" class="pri">Chiudi</button>
    </div>
    <div id="gList"></div>
  </section>
  <section id="settings" hidden>
    <div class="sbar">
      <strong>Impostazioni</strong>
      <button id="tabList" class="on">Elenco</button>
      <button id="tabJson">JSON</button>
      <span class="sp"></span>
      <button id="imp">Importa…</button>
      <button id="exp">Esporta</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
      <button id="sCancel">Chiudi</button>
      <button id="sSave" class="pri">Salva</button>
    </div>
    <div id="sMsg"></div>
    <div id="sList"></div>
    <textarea id="sJson" spellcheck="false" hidden></textarea>
  </section>
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="groups.js"></script>
</body>
</html>
